# IP-Roller Bot — конфигурация.
# Секреты подставляются из переменных окружения через ${VAR} (см. .env.example).
# Включай провайдера только когда задал его токен/креды: enabled: true.

telegram:
  token: ${TELEGRAM_TOKEN}
  # Админы и allowed можно задавать ЗДЕСЬ списком ИЛИ через env (удобнее для .env/Docker):
  #   TELEGRAM_ADMIN_IDS=123,456   TELEGRAM_ALLOWED_IDS=789
  # env-значения добавляются к спискам ниже (не заменяют).
  admin_user_ids: []            # напр. [123456789] — кто управляет аккаунтами и whitelist'ом
  allowed_user_ids: []          # статически разрешённые; пустые admin+allowed+whitelist = доступ всем

storage:
  driver: sqlite                # реализован только sqlite
  dsn: ./ip-roller.db

# Уведомления о ловле IP в отдельную форум-супергруппу. Бот авто-создаёт топик
# на каждый аккаунт (нужно: бот — админ группы с правом «Управление темами»,
# в группе включены Топики/Forum). chat_id можно задать тут или через env
# NOTIFY_CHAT_ID (если задан — уведомления включаются автоматически).
notify:
  enabled: false
  chat_id: 0                    # напр. -1001234567890

# Авто-ролл: раз в interval_hours бот сам роллит аккаунты, у которых включён
# тумблер 🔁 (🔐 Аккаунты → 🔁), по их 🎯 IP-пресетам, и пишет итог в топик
# аккаунта. enabled: false — глобально выключить расписание (пер-аккаунт тумблеры
# перестанут срабатывать). Пропущенный блок = включено (гейт — пер-аккаунт).
autoroll:
  enabled: true
  interval_hours: 24

# ВНИМАНИЕ: креды провайдеров теперь хранятся в SQL-таблице accounts (можно
# несколько аккаунтов на каждый тип). Блоки providers ниже — это (1) дефолты по
# типу (caps, маски, strategy, region/zone/auth_url) и (2) ОДНОРАЗОВЫЙ сид: при
# первом старте, если таблица accounts пуста, включённые блоки с заданными
# кредами (${...} из env) заводятся как аккаунт label="default". Дальше управляй
# аккаунтами через бота: /accounts, /addaccount, /delaccount, /enableaccount.
# env нужен только для первичного сида — после него можно убрать токены из env.
providers:
  # --- floating/reserved IP через API (лучший случай для роллинга) ---

  timeweb:
    enabled: true               # самый чистый REST — включён по умолчанию
    token: ${TIMEWEB_TOKEN}
    availability_zone: spb-1
    strategy: floating
    max_rolls_per_run: 10
    daily_cap: 10               # Timeweb: ≤10 новых IPv4/сутки на сервер
    rate_limit_rps: 15          # держим ниже 20/s
    roll_delay_ms: 1500         # пауза между роллами (мс); 0 = стандартный джиттер
    cost_per_roll: "~150₽/мес пока IP не удалён"
    masks: ["185.12.0.0/16", "95.142.*.*"]

  vkcloud:
    enabled: false
    # VK Cloud API работает по логину/паролю (application credentials НЕ поддержаны).
    # Значения бери из openrc-файла проекта (Настройки проекта → API-доступ).
    auth_url: https://infra.mail.ru:35357/v3/   # OS_AUTH_URL
    region: RegionOne                            # OS_REGION_NAME
    user_domain_name: users                      # OS_USER_DOMAIN_NAME
    username: ${VK_USERNAME}                      # OS_USERNAME (email)
    password: ${VK_PASSWORD}                      # OS_PASSWORD
    project_id: ${VK_PROJECT_ID}                 # OS_PROJECT_ID
    floating_network_id: ${VK_EXT_NET_ID}
    strategy: floating
    max_rolls_per_run: 40
    daily_cap: 0                # 0 = без дневного лимита, ограничивает квота
    floating_ip_quota: 50
    rate_limit_rps: 5
    roll_delay_ms: 800          # джиттер/пауза между роллами
    masks: ["45.10.0.0/16"]

  yandex:
    enabled: false
    # OAuth-токен Яндекса (бот обменяет на IAM). region = zone_id.
    oauth_token: ${YC_OAUTH_TOKEN}
    folder_id: ${YC_FOLDER_ID}
    region: ru-central1-a        # zone_id: ru-central1-a|b|d
    strategy: floating
    max_rolls_per_run: 25
    daily_cap: 0
    rate_limit_rps: 5
    roll_delay_ms: 1000
    masks: ["51.250.0.0/16", "158.160.*.*"]

  selectel:
    enabled: false
    auth_url: https://cloud.api.selcloud.ru/identity/v3
    account_id: ${SEL_ACCOUNT_ID}
    service_user: ${SEL_SERVICE_USER}
    service_password: ${SEL_SERVICE_PASSWORD}
    project_id: ${SEL_PROJECT_ID}
    region: ru-9
    floating_network_id: ${SEL_EXT_NET_ID}
    strategy: floating
    max_rolls_per_run: 40
    daily_cap: 0
    floating_ip_quota: 50
    rate_limit_rps: 5
    masks: ["188.225.0.0/16", "5.188.*.*"]

  gcore:
    enabled: false
    api_url: https://api.gcore.com/cloud
    api_token: ${GCORE_API_TOKEN}     # заголовок: Authorization: apikey <token>
    project_id: ${GCORE_PROJECT_ID}   # можно вставить ссылку на проект — id вытащится из URL
    region_id: 0                      # 0/пусто = роллить по ЛЮБОМУ региону (бот переберёт); задай число, чтобы закрепить регион
    strategy: floating
    max_rolls_per_run: 40
    daily_cap: 0
    rate_limit_rps: 5
    masks: ["92.38.0.0/16"]

  mws:
    enabled: false
    # token — IAM-токен: `mws iam create-token` (НЕ статический v1.… API-ключ!).
    # Короткоживущий: при 401 перевыпусти и перезапиши token. VPC: https://vpc.mwsapis.ru.
    token: ${MWS_TOKEN}
    project_id: ${MWS_PROJECT_ID}
    strategy: floating
    max_rolls_per_run: 10
    daily_cap: 10               # ≤10 новых IP/сутки (мягкий предохранитель)
    rate_limit_rps: 5
    roll_delay_ms: 1500         # пауза между роллами (мс)
    masks: ["89.108.0.0/16"]

  # --- IP привязан к серверу: роллинг пересозданием / заказом доп. IP ---
  # Allocate выдаёт явную ошибку, пока не задан server_id и платный сценарий
  # (эти операции мутируют/пересоздают реальные платные серверы).

  ruvds:
    enabled: false
    token: ${RUVDS_TOKEN}
    strategy: recreate          # recreate | additional_ip
    server_id: ${RUVDS_SERVER_ID}
    max_rolls_per_run: 3
    daily_cap: 5
    rate_limit_rps: 2
    cost_per_roll: "пересоздание сервера"
    masks: ["31.130.0.0/16"]

  beget:
    enabled: false
    api_url: https://api.beget.com
    token: ${BEGET_TOKEN}
    strategy: additional_ip     # additional_ip | recreate
    server_id: ${BEGET_SERVER_ID}
    max_rolls_per_run: 5
    daily_cap: 10
    rate_limit_rps: 2
    cost_per_roll: "поштучная оплата IP"
    masks: ["5.101.0.0/16"]

  # IHC / Contell / UFO.Hosting / Vinton — публичного API нет, роллинг только
  # через cookie-фолбэк (internal/provider/cookie). Нативного адаптера нет,
  # поэтому здесь они не настраиваются.
